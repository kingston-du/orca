<!doctype html>
<html lang="en">
  <body
    style="
      background: #f5faff;
      color: #102a43;
      font-family: sans-serif;
      padding: 32px;
    "
  >
    <main
      style="
        background: #ffffff;
        border-radius: 16px;
        margin: 0 auto;
        max-width: 480px;
        padding: 32px;
      "
    >
      <p
        style="color: #208aef; font-size: 24px; font-weight: 800; margin-top: 0"
      >
        splotty
      </p>
      <h1 style="font-size: 24px">Confirm your email</h1>
      <p>Enter this six-digit code in Splotty:</p>
      <p style="font-size: 32px; font-weight: 800; letter-spacing: 8px">
        {{ .Token }}
      </p>
      <p>
        This code expires in one hour. If you did not create an Splotty account,
        you can ignore this email.
      </p>
    </main>
  </body>
</html>
