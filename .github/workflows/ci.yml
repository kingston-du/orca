name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check immutable legal document hashes
        run: npm run legal:check

      - name: Check store listing metadata against the accepted agreement
        run: npm run store:check

      - name: Lint with zero warnings
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run component tests
        run: npm test

      - name: Check Expo dependency compatibility
        run: npm run expo:check

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Check generated native privacy configuration
        run: npm run native:check

  database:
    name: Database quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Postgres
        run: npm run db:start

      - name: Rebuild from migrations
        run: npm run db:reset

      - name: Lint database schemas
        run: npm run db:lint

      - name: Run pgTAP tests
        run: npm run db:test

      - name: Run real Auth, Data API, and Storage tests
        run: npm run db:test:api

      - name: Test bounded JPEG and media-cleanup logic
        run: npm run functions:test

      - name: Serve Edge Functions
        run: |
          npx supabase functions serve > /tmp/functions.log 2>&1 &
          # The runtime downloads its image on first start, so poll for the
          # endpoint instead of guessing a fixed sleep.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:54321/functions/v1/reconcile-operations" \
              -X POST -d '{}'; then break; fi
            if grep -q "Serving functions on" /tmp/functions.log; then break; fi
            sleep 2
          done

      - name: Run Edge Function orchestration tests
        run: npm run functions:test:api

      - name: Check generated database types
        run: npm run db:types:check
