name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check immutable legal document hashes
        run: npm run legal:check

      - name: Lint with zero warnings
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run component tests
        run: npm test

      - name: Check Expo dependency compatibility
        run: npm run expo:check

      - name: Run Expo Doctor
        run: npm run doctor

  database:
    name: Database quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Postgres
        run: npm run db:start

      - name: Rebuild from migrations
        run: npm run db:reset

      - name: Lint database schemas
        run: npm run db:lint

      - name: Run pgTAP tests
        run: npm run db:test

      - name: Run private Storage API integration tests
        run: npm run db:test:storage

      - name: Check generated database types
        run: npm run db:types:check
